<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jeoffrey Delos Reyes / jofwee</title>
  <desc id="desc">An animated solid midnight banner with a white name, floating cyan accents, and a moving border. Web apps, desktop tools, automation, and reinforcement learning.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a6c5d1" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <style>
    .ui { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .trail { animation: travel 14s linear infinite; }
    .spark { animation: twinkle 4s ease-in-out infinite; }
    .float { animation: drift 7s ease-in-out infinite; }
    .other { animation-delay: -3s; }
    @keyframes travel { to { stroke-dashoffset: -3072; } }
    @keyframes twinkle { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) {
      .trail, .spark, .float { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0d1117"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <g fill="none" stroke="#6adbed" stroke-opacity=".12">
      <circle cx="20" cy="330" r="100"/>
      <circle cx="20" cy="330" r="145"/>
      <circle cx="1180" cy="30" r="100"/>
      <circle cx="1180" cy="30" r="145"/>
    </g>
    <g class="float" fill="none" stroke="#6adbed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".65">
      <path d="m95 108-12 12 12 12m32-24 12 12-12 12m-12-30-8 36"/>
      <path d="M1033 273h12m-6-6v12"/>
    </g>
    <g class="float other" fill="none" stroke="#6adbed" stroke-width="2" opacity=".65">
      <path d="m1083 227 9-9 9 9-9 9z"/>
      <path d="M155 277h12m-6-6v12"/>
    </g>
    <g fill="#8ee9e2">
      <circle class="spark" cx="195" cy="67" r="2"/>
      <circle class="spark other" cx="1010" cy="88" r="2"/>
      <circle class="spark" cx="895" cy="305" r="2"/>
      <circle class="spark other" cx="287" cy="295" r="1.5"/>
    </g>
    <rect x="514" y="57" width="172" height="32" rx="16" fill="#161b22" stroke="#6adbed" stroke-opacity=".25"/>
    <circle class="spark" cx="543" cy="73" r="3" fill="#8ee9e2"/>
    <text class="mono" x="607" y="78" text-anchor="middle" font-size="14" letter-spacing="3" fill="#c9d1d9">JOFWEE</text>
    <text class="ui" x="600" y="185" text-anchor="middle" font-size="66" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Jeoffrey Delos Reyes</text>
    <path d="M495 214h210" stroke="#6adbed" stroke-opacity=".55"/>
    <text class="ui" x="600" y="249" text-anchor="middle" font-size="17" letter-spacing="1" fill="#aaaec7">Web apps · Desktop tools · Automation · Reinforcement learning</text>
    <text class="mono" x="40" y="328" font-size="11" letter-spacing="2" fill="#777d9c">&lt; / &gt;</text>
    <path d="M1100 324h24m8 0h28" stroke="#7ce6ee" stroke-opacity=".4"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="#a6c5d1" stroke-opacity=".18"/>
  <rect class="trail" x="2" y="2" width="1196" height="356" rx="23" fill="none" stroke="#6adbed" stroke-width="2" stroke-dasharray="150 2922" stroke-linecap="round" opacity=".8"/>
</svg>
